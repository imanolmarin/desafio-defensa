# Capa de borde: filtrado grueso y barato. NO reemplaza la validación en el servicio.
worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Los requests de escritura deben declarar un body JSON.
    map "$request_method:$content_type" $bad_content_type {
        default 0;
        "~^(POST|PUT|PATCH):(?!application/json)" 1;
    }

    upstream comments {
        server comments-service:8000;
    }

    server {
        listen 80;

        client_max_body_size 16k;
        large_client_header_buffers 4 8k;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        # Front estático (material del desafío, etapa 2).
        location /app/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        # Las rutas internas no se exponen en el borde.
        location /internal/ {
            return 404;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            if ($bad_content_type) {
                return 415;
            }

            proxy_pass http://comments;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
